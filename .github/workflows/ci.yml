name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Privacy check
        run: npm run privacy:check

      - name: Extension manifest check
        run: npm run extension:check

      # Les vulnérabilités de dépendances passaient jusqu'ici entièrement
      # sous le radar de la CI (4 avis "high" ouverts au moment de l'ajout).
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

