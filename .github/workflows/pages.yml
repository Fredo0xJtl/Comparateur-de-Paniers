# Publie l'application sur GitHub Pages.
#
# GitHub Pages sert un dépôt de projet sous un SOUS-CHEMIN
# (`https://<compte>.github.io/<dépôt>/`) et non à la racine d'un domaine.
# Le build doit donc connaître ce préfixe : c'est le rôle de `build:pages`
# (voir tools/build-pages.mjs). Un `npm run build` ordinaire produirait des
# chemins absolus et une page blanche.
#
# Ce workflow refait les vérifications avant de déployer plutôt que de faire
# confiance à la CI : les deux tournent en parallèle sur un même push, et
# rien ne garantirait sinon qu'une version dont les tests échouent ne parte
# pas en ligne.
name: Pages

on:
  push:
    branches: [main]
  # Permet aussi un déploiement manuel depuis l'onglet Actions, sans commit.
  workflow_dispatch:

# Droits minimaux par défaut. Les droits d'écriture sur Pages ne sont donnés
# qu'au job `deploy` plus bas : le job `build` installe et exécute du code
# tiers (npm ci), il ne doit pas pouvoir publier.
permissions:
  contents: read

# Un seul déploiement à la fois. `cancel-in-progress: false` : un déploiement
# déjà lancé va au bout, sinon Pages peut rester sur une version partielle.
concurrency:
  group: pages
  cancel-in-progress: false

# Le dépôt de développement porte le suffixe `-Dev`, mais la page publique
# historique — et l'adresse autorisée par le connecteur Firefox — ne l'a pas.
# Cette valeur est la source de vérité du workflow : ne jamais la déduire du
# nom du dépôt.
env:
  PUBLIC_BASE: /Comparateur-de-Paniers/

jobs:
  build:
    # GitHub Pages n'existe pas sur un dépôt privé en offre gratuite : sur
    # l'atelier privé ce workflow échouait à chaque push, et ce rouge
    # permanent masquait les vrais échecs. Il ne tourne que sur un dépôt public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte (SHA) : une étiquette comme `v7` peut
      # être déplacée par son éditeur, une empreinte non. Dependabot met à
      # jour l'empreinte et le commentaire de version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      # Garde-fou. L'extension Firefox n'installe son pont avec l'application
      # que sur les adresses listées dans `content_scripts.matches` de son
      # manifest. Si l'adresse réellement publiée n'y figure pas — un tiret à
      # la place d'un souligné suffit — le site se charge normalement, mais le
      # remplissage automatique du panier, la fonction principale, reste mort
      # sans le moindre message d'erreur. Un déploiement en échec ici est bien
      # préférable à ce silence.
      - name: Verifie que l'extension connait l'adresse publiee
        run: |
          # Seul le nom d'hôte est insensible à la casse ; le chemin, non.
          proprietaire=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          adresse="https://${proprietaire}.github.io${PUBLIC_BASE}"
          if ! grep -qF "$adresse" extension/manifest.json; then
            echo "::error::extension/manifest.json ne declare pas $adresse dans content_scripts.matches."
            echo "Adresses actuellement declarees :"
            grep -o 'https://[^"]*' extension/manifest.json || true
            echo "Corrigez le manifest, ou renommez le depot pour qu'il corresponde."
            exit 1
          fi
          echo "OK : l'extension reconnait $adresse"
          # Le même préfixe est transmis à l'étape de build : ce qui est
          # vérifié et ce qui est construit ne peuvent donc pas diverger.
          echo "PUBLIC_BASE=${PUBLIC_BASE}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Mêmes garde-fous que la CI : une dépendance vulnérable ou un code
      # refusé par ESLint ne doit pas partir en ligne.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Test
        run: |
          npm run test
          node --test tools/pages-workflow.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Mêmes contrôles que la CI : sans eux, une version qui contacte une
      # adresse non déclarée ou dont le manifeste est invalide partait en
      # ligne alors que la CI était rouge.
      - name: Privacy check
        run: npm run privacy:check

      - name: Extension manifest check
        run: npm run extension:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # `PUBLIC_BASE` est l'adresse publique explicitement contrôlée ci-dessus.
      - name: Build
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Jeton d'identité réclamé par actions/deploy-pages pour prouver à
      # GitHub Pages que l'artefact vient bien de ce workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
